name: CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Node 
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # Backend 
      - name: Install Backend
        run: |
          cd transport-backend
          npm install

      # Frontend 
      - name: Install Frontend
        run: |
          cd transport-frontend
          npm install

      - name: Build Frontend
        run: |
          cd transport-frontend
          npm run build

      #  Python 
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.10

      - name: Install ML Dependencies
        run: |
          cd ml-services
          pip install -r requirements.txt