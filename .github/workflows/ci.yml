name: CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code download
        uses: actions/checkout@v3

      # Node setup
      - name: Node setup
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # Backend install
      - name: Backend install
        run: |
          cd backend
          npm install

      # Frontend install
      - name: Frontend install
        run: |
          cd frontend
          npm install

      # Frontend build
      - name: Frontend build
        run: |
          cd frontend
          npm run build

      # Python setup
      - name: Python setup
        uses: actions/setup-python@v4
        with:
          python-version: 3.10

      # ML install
      - name: ML install
        run: |
          cd ml-services
          pip install -r requirements.txt